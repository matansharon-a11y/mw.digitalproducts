# Supabase CLI settings for this project (used by `supabase functions deploy`).
# JWT verification at the gateway is off for every function because each one
# authenticates its own callers. This also keeps working with Supabase's newer
# non-JWT publishable keys.
project_id = "mwp-presets"

[functions.checkout-webhook]
verify_jwt = false   # checkout provider: verified by HMAC signature

[functions.get-download]
verify_jwt = false   # verifies the customer's session token itself (auth.getUser)

[functions.beta]
verify_jwt = false   # Ambassador Program page: open by link, sign-ups rate-limited per IP

[functions.license]
verify_jwt = false   # MWP Panel licences: verifies the buyer's session token itself (auth.getUser)

[functions.support]
verify_jwt = false   # public form: honeypot + per-email rate limit

[functions.subscribe]
verify_jwt = false   # public form: validation + idempotent upsert

[functions.scheduler]
verify_jwt = false   # database calls carry the Vault key; Make call back carries a one-time nonce

[functions.guide-view]
verify_jwt = false   # Field Guides online: verifies the reader's session token itself (auth.getUser)

[functions.tester]
verify_jwt = false   # testers page: sign-in links only for approved emails (rate-limited per IP); "me" checks the session itself

[functions.admin-docs]
verify_jwt = false   # admin only: checks the caller's own session with is_admin() (two-step sign-in included)

[functions.checkout-il]
verify_jwt = false   # Israeli checkout at the VAT price: verifies the buyer's session token itself (auth.getUser)
