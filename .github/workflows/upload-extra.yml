# Upload an extra download (e.g. MWP Panel's Lightroom Classic plugin) without the file being readable in this public
# repo: the run pushes a public key to a temporary branch, receives the zip encrypted with it, uploads it to the private
# bucket, adds the button to My downloads (product_extra_files) and deletes the branch. See tools/upload_extra.py.
# The admin's Extra downloads box does the same by hand.
name: Upload an extra download

on:
  workflow_dispatch:
    inputs:
      slug: { description: "Product slug", default: "mwp-presets", required: true }
      file_key: { description: "Key", default: "lightroom-classic", required: true }
      label: { description: "Button in My downloads", default: "Lightroom Classic plugin", required: true }
      version: { description: "Version", required: true }
      file_name: { description: "File name (.zip)", required: true }

permissions:
  contents: write   # the temporary upload-drop branch only

env:
  SUPABASE_PROJECT_REF: tkkpxsyioetzexgbmbqy

jobs:
  upload:
    name: Upload an extra download
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359  # v3.0.1
        with:
          version: 2.120.0

      - name: Get the database key
        run: |
          KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json | jq -r '.[] | select(.name=="service_role") | .api_key')
          [ -n "$KEY" ] || { echo "::error::Couldn't read the service key (is SUPABASE_ACCESS_TOKEN set?)"; exit 1; }
          echo "::add-mask::$KEY"
          echo "SUPABASE_SERVICE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=https://$SUPABASE_PROJECT_REF.supabase.co" >> "$GITHUB_ENV"

      - name: Upload
        env:
          SLUG: ${{ inputs.slug }}
          FILE_KEY: ${{ inputs.file_key }}
          LABEL: ${{ inputs.label }}
          VERSION: ${{ inputs.version }}
          FILE_NAME: ${{ inputs.file_name }}
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: python3 tools/upload_extra.py
