# ============================================================================
# Personal copies. Stamps each buyer's (and beta member's) Presets and Field
# Guides download with their name, email and licence ID (tools/personalize/),
# and makes each ambassador's signed-terms PDF (attached in monday via Make).
# Runs right away when a purchase, a beta join or a download asks for it (needs
# the PERSONALIZE_TOKEN secret), once an hour as a backup, and by hand:
# Actions → Personal copies → Run workflow. Only makes copies that are missing
# or out of date. (Hourly, not more often: every run counts as at least one
# Actions minute.)
# ============================================================================
name: Personal copies

on:
  schedule:
    - cron: "7 * * * *"
  repository_dispatch:
    types: [personalize]
  workflow_dispatch:
    inputs:
      check_guides:
        description: "Only check that each single Field Guide can be cut from the set's pack (counts only, nothing made)"
        type: boolean
        default: false
  # right after each deploy (new tables and functions are in place by then)
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  push:
    branches: [main]
    paths: ["tools/personalize/**", ".github/workflows/personalize.yml"]

permissions:
  contents: read

concurrency:
  group: personalize
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: tkkpxsyioetzexgbmbqy

jobs:
  make:
    name: Make missing personal copies
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 19 Oct 2026
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359  # v3.0.1
        with:
          version: 2.120.0

      - name: Get the storage key
        run: |
          KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json | jq -r '.[] | select(.name=="service_role") | .api_key')
          [ -n "$KEY" ] || { echo "::error::Couldn't read the service key"; exit 1; }
          echo "::add-mask::$KEY"
          echo "SUPABASE_SERVICE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=https://$SUPABASE_PROJECT_REF.supabase.co" >> "$GITHUB_ENV"

      - name: Install the stamping tools
        run: |
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null
          pip install -q pypdf reportlab python-bidi requests pymupdf

      - name: Make the copies
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_SHARED_SECRET: ${{ secrets.MAKE_SHARED_SECRET }}
        env:
          CHECK_GUIDES: ${{ inputs.check_guides }}
        run: .github/scripts/run.sh "Personal copies" python3 tools/personalize/worker.py
