# ============================================================================
# Automatic deployment. Every push to main:
#   1. publishes the website to GitHub Pages
#   2. applies new database migrations, sets function secrets and deploys the
#      Edge Functions to Supabase (runs from GitHub; skipped with a warning
#      until SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD are set)
# Run it by hand any time: Actions → Deploy → Run workflow.
# ============================================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: tkkpxsyioetzexgbmbqy

jobs:
  website:
    name: Website to GitHub Pages
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 19 Oct 2026
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Collect the public site files
        # Only the website goes online; server code, SQL and docs stay in the repository.
        run: |
          mkdir _site
          cp *.html robots.txt sitemap.xml favicon.ico .nojekyll _site/
          cp -r assets admin presets lightroom-classic panel field-guides beta account shop product support legal accessibility thank-you read testers he _site/
          # The current prices written into the pages, so they show at once (the browser still checks the live ones).
          python3 tools/bake_prices.py _site
          # Fresh scripts after every deploy: each page asks for the current version of every script it uses.
          python3 tools/stamp_scripts.py _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
          include-hidden-files: true   # keep publishing .nojekyll and any other dotfiles, as before

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  supabase:
    name: Database and server functions to Supabase
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 19 Oct 2026
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check the Supabase secrets are set
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning title=Supabase deploy skipped::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD under Settings > Secrets and variables > Actions, then re-run this workflow."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.ready.outputs.ok == 'true'

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359  # v3.0.1
        if: steps.ready.outputs.ok == 'true'
        with:
          version: 2.120.0   # pinned: the same Supabase CLI every run (v3 installs it from npm)

      - name: Link the Supabase project
        if: steps.ready.outputs.ok == 'true'
        run: .github/scripts/run.sh "Supabase link" supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        # Only migrations not yet applied run; already-applied ones are skipped.
        if: steps.ready.outputs.ok == 'true'
        run: .github/scripts/run.sh "Database migrations" supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Set function secrets
        if: steps.ready.outputs.ok == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://shop.mw.photography' }}
          DOWNLOAD_DAILY_LIMIT: ${{ vars.DOWNLOAD_DAILY_LIMIT || '5' }}
          CHECKOUT_WEBHOOK_SECRET: ${{ secrets.CHECKOUT_WEBHOOK_SECRET }}
          MAKE_SHARED_SECRET: ${{ secrets.MAKE_SHARED_SECRET }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
          MAKE_ORDER_WEBHOOK: ${{ secrets.MAKE_ORDER_WEBHOOK }}
          MAKE_SUPPORT_WEBHOOK: ${{ secrets.MAKE_SUPPORT_WEBHOOK }}
          MAKE_SUBSCRIBE_WEBHOOK: ${{ secrets.MAKE_SUBSCRIBE_WEBHOOK }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          PERSONALIZE_TOKEN: ${{ secrets.PERSONALIZE_TOKEN }}
          PERSONALIZE_REPO: ${{ github.repository }}
          # the hourly missed-orders check (scheduler "reconcile") reads the store's orders with it
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
          LEMONSQUEEZY_STORE_ID: ${{ vars.LEMONSQUEEZY_STORE_ID || '502637' }}
        run: |
          args=()
          for name in SITE_URL DOWNLOAD_DAILY_LIMIT CHECKOUT_WEBHOOK_SECRET MAKE_SHARED_SECRET IP_HASH_SALT \
                      MAKE_ORDER_WEBHOOK MAKE_SUPPORT_WEBHOOK MAKE_SUBSCRIBE_WEBHOOK MAKE_WEBHOOK_URL \
                      PERSONALIZE_TOKEN PERSONALIZE_REPO LEMONSQUEEZY_API_KEY LEMONSQUEEZY_STORE_ID; do
            value="${!name}"
            if [ -n "$value" ]; then args+=("$name=$value"); continue; fi
            case "$name" in
              # Optional: orders, support and sign-ups use MAKE_WEBHOOK_URL when these aren't set.
              MAKE_ORDER_WEBHOOK|MAKE_SUPPORT_WEBHOOK|MAKE_SUBSCRIBE_WEBHOOK) ;;
              # Without these, nothing reaches Make.com, so nothing reaches monday.com.
              MAKE_WEBHOOK_URL|MAKE_SHARED_SECRET)
                echo "::warning title=monday.com sync::$name is not set, so shop events won't reach Make.com and monday.com. Add it under Settings > Secrets and variables > Actions." ;;
              *) echo "::notice::$name not set yet" ;;
            esac
          done
          .github/scripts/run.sh "Function secrets" supabase secrets set "${args[@]}" --project-ref "$SUPABASE_PROJECT_REF"

      - name: Account safety settings
        # Accounts use email + password. New accounts must confirm their email before they can sign in,
        # so nobody can open an account on someone else's email and see their purchases. Passwords
        # need at least 8 characters. Emailed links (confirm, reset password, sign-in) may return to any page of
        # the shop: Supabase sends a link whose return address isn't on its allowed list to the site URL instead,
        # which made "Forgot password" land on the home page (24 Oct 2026). Addresses already allowed are kept.
        if: steps.ready.outputs.ok == 'true'
        env:
          SHOP: ${{ vars.SITE_URL || 'https://shop.mw.photography' }}
        run: |
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth"
          curl -sS -o /tmp/auth_before.json -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api"
          allow=$(jq -r --arg want "$SHOP/**" '[(.uri_allow_list // "" | split(",") | map(select(length > 0))), [$want]] | add | unique | join(",")' /tmp/auth_before.json)
          # The "Confirm signup" email (supabase/templates: free-guide or regular, Hebrew or English), checked first:
          # a template that fails to render would stop every sign-up email, so a broken one stops the deploy instead.
          go run tools/check_email_template.go supabase/templates/confirmation.html supabase/templates/confirmation_subject.txt
          body=$(jq -n --arg site "$SHOP" --arg allow "$allow" \
            --rawfile tpl supabase/templates/confirmation.html --rawfile subj supabase/templates/confirmation_subject.txt \
            '{mailer_autoconfirm: false, password_min_length: 8, site_url: $site, uri_allow_list: $allow,
              mailer_templates_confirmation_content: $tpl, mailer_subjects_confirmation: ($subj | rtrimstr("\n"))}')
          code=$(curl -sS -o /tmp/auth.json -w "%{http_code}" -X PATCH "$api" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
          if [ "$code" != "200" ]; then echo "::error title=Account safety settings::Supabase answered $code"; exit 1; fi
          echo "Email confirmation required: $(jq -r '.mailer_autoconfirm == false' /tmp/auth.json), minimum password length: $(jq -r '.password_min_length' /tmp/auth.json)"
          echo "Site URL: $(jq -r '.site_url' /tmp/auth.json); links may return to: $(jq -r '.uri_allow_list' /tmp/auth.json)"
          # The reset and confirm emails must link to the emailed link itself ({{ .ConfirmationURL }}), not to the site
          for t in recovery confirmation magic_link; do
            body=$(jq -r ".mailer_templates_${t}_content // \"\"" /tmp/auth.json)
            if [ -z "$body" ]; then echo "Email template $t: Supabase's default"
            elif grep -q 'ConfirmationURL\|TokenHash' <<<"$body"; then echo "Email template $t: custom, uses the emailed link"
            else echo "::warning title=Email template $t::It doesn't use {{ .ConfirmationURL }}, so its button can't sign anyone in or reset a password"; fi
          done
          # Account emails (confirm, reset, sign-in links): Supabase's built-in sender allows only a few an hour, too
          # few for a launch. Report whether the project has its own email server (the host only, never the password).
          smtp=$(jq -r '.smtp_host // ""' /tmp/auth.json)
          echo "Account emails per hour: $(jq -r '.rate_limit_email_sent' /tmp/auth.json), own email server: ${smtp:-none}"
          [ -n "$smtp" ] || echo "::warning title=Account emails::No custom SMTP server: Supabase's built-in sender allows only a few account emails an hour. Set one under Supabase > Authentication > Emails > SMTP Settings before launch."

      - name: Deploy server functions
        # JWT settings per function come from supabase/config.toml
        if: steps.ready.outputs.ok == 'true'
        run: .github/scripts/run.sh "Function deploy" supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
