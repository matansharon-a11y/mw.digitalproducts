# Connect Lemon Squeezy: run by hand (Actions > Connect Lemon Squeezy > Run workflow).
# Reads the store's products, writes each one's checkout link and variant ID into the shop, and makes sure the
# order webhook exists. Safe to run again: it only fills in links and never changes prices or deletes anything.
# Needs the LEMONSQUEEZY_API_KEY secret (Lemon Squeezy > Settings > API), plus the Supabase secrets the deploy uses.
name: Connect Lemon Squeezy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write to the shop (untick for a dry run that only reports)"
        type: boolean
        default: true
      store_id:
        description: "Lemon Squeezy store ID (needed when the account has more than one store)"
        type: string
        default: ""
      new_signing_secret:
        description: "Give the existing webhook a new signing secret (made here, never shown)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: tkkpxsyioetzexgbmbqy

jobs:
  connect:
    name: Connect Lemon Squeezy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359  # v3.0.1
        with:
          version: 2.120.0

      - name: Get the database key
        run: |
          KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json | jq -r '.[] | select(.name=="service_role") | .api_key')
          [ -n "$KEY" ] || { echo "::error::Couldn't read the service key (is SUPABASE_ACCESS_TOKEN set?)"; exit 1; }
          echo "::add-mask::$KEY"
          echo "SUPABASE_SERVICE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=https://$SUPABASE_PROJECT_REF.supabase.co" >> "$GITHUB_ENV"

      - name: Connect
        env:
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
          APPLY: ${{ inputs.apply }}
          STORE_ID: ${{ inputs.store_id }}
          NEW_SIGNING_SECRET: ${{ inputs.new_signing_secret }}
        run: python3 tools/connect_lemonsqueezy.py
